    function spawnQuizGate() {
        const prob = activeQuiz;
        if (!prob) return;

        // 3 slot (A-C) pada awal, 4 slot (A-D) mulai tier PRO
        const slotCount = prob.options.length;
        const barrierHeight = slotCount === 4 ? 20 : 26;
        const usableHeight = PLAYABLE_HEIGHT - barrierHeight * (slotCount + 1);
        const slotHeight = usableHeight / slotCount;

        const slots = [];
        for (let i = 0; i < slotCount; i++) {
            const topY = barrierHeight + i * (slotHeight + barrierHeight);
            slots.push({
                index: i,
                label: SLOT_LABELS[i],
                text: prob.options[i],
                color: SLOT_COLORS[i],
                topY: topY,
                bottomY: topY + slotHeight,
                isCorrect: i === prob.correctIndex
            });
        }

        // Pada layar sangat lebar gerbang muncul lebih dekat (dengan efek "materialize")
        const spawnX = Math.min(LOGICAL_WIDTH + 40, BIRD_X + 760);
        const baseSpeed = getBaseScrollSpeed(getDifficulty());
        const speedMul = Math.min(2.4, Math.max(0.88, (spawnX - BIRD_X) / (200 * baseSpeed)));

        quizGates.push({
            x: spawnX,
            width: 76,
            barrierHeight: barrierHeight,
            slots: slots,
            problem: prob,
            resolved: false,
            result: null,        // 'CORRECT' | 'WRONG' | 'SAVED'
            chosenIndex: -1,
            hoverSlot: -1,
            flash: 0,
            age: 0,
            appear: spawnX < LOGICAL_WIDTH ? 0 : 1,
            speedMul: speedMul,
            spawnDist: Math.max(1, spawnX - BIRD_X),
            bobAmp: prob.tier >= 2 ? Math.min(16, 6 + (prob.tier - 2) * 5) : 0,
            bobPhase: Math.random() * Math.PI * 2,
            offsetY: 0
        });
    }

    // Slot yang sedang dilewati burung (-1 bila mengenai pembatas)
    function findGateSlot(qg, y, margin) {
        const yy = y - qg.offsetY;
        for (const s of qg.slots) {
            if (yy >= s.topY + margin && yy <= s.bottomY - margin) return s.index;
        }
        return -1;
    }

    // Partikel data kecil yang mengalir dari gerbang
    function emitGateParticles(qg) {
        if (frameCount % 5 !== 0 || qg.x > LOGICAL_WIDTH + 20) return;
        const slot = pick(qg.slots);
        particles.push({
            x: qg.x + Math.random() * qg.width,
            y: slot.topY + Math.random() * (slot.bottomY - slot.topY) + qg.offsetY,
            vx: -0.4 - Math.random() * 0.8,
            vy: (Math.random() - 0.5) * 1.2,
            size: 2 + Math.random() * 1.5,
            color: slot.color,
            alpha: 0.9,
            decay: 0.03
        });
    }

    function resolveMathCorrect(qg, slot) {
        qg.resolved = true;
        qg.result = 'CORRECT';
        qg.chosenIndex = slot.index;
        qg.flash = 70;

        mathStats.solved++;
        mathStats.streak++;
        mathStats.bestStreak = Math.max(mathStats.bestStreak, mathStats.streak);
        qg.problem.ops.forEach(id => { mathStats.perOp[id]++; });
        lastMathResult = { problem: qg.problem, chosenText: slot.text, correct: true };

        if (mathStats.bestStreak > bestComboAll) {
            bestComboAll = mathStats.bestStreak;
            try { localStorage.setItem('cyberFlappyBestCombo', String(bestComboAll)); } catch (e) {}
        }

        audio.sfxQuizCorrect();
        if (mathStats.streak >= 2) audio.sfxStreak(mathStats.streak);
        screenFlashColor = '#39FF14';
        screenFlashAlpha = 0.4;
        floatingTexts.push({
            x: bird.x + 20, y: bird.y - 34,
            text: 'ACCESS GRANTED!', color: '#39FF14', alpha: 1, vy: -1.4
        });
        for (let k = 0; k < 30; k++) {
            particles.push({
                x: bird.x, y: bird.y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                size: 3.5, color: k % 3 === 0 ? slot.color : '#39FF14', alpha: 1, decay: 0.03
            });
        }

        // Hadiah combo
        let comboText = null;
        if (mathStats.streak === 3 && !activeEffects.shield) {
            activeEffects.shield = true;
            comboText = 'COMBO x3: SHIELD!';
        } else if (mathStats.streak === 5) {
            activeEffects.doubleScore = 420;
            comboText = 'COMBO x5: 2X BOOST!';
        } else if (mathStats.streak >= 7 && mathStats.streak % 2 === 1) {
            activeEffects.slowMo = 300;
            comboText = 'COMBO x' + mathStats.streak + ': CHRONO!';
        }
        if (comboText) {
            floatingTexts.push({
                x: bird.x + 30, y: bird.y - 74,
                text: comboText, color: '#FFE600', alpha: 1, vy: -1.2
            });
        }

        // Poin bonus: 4 dasar + 1 per streak (maks +4)
        const bonus = 4 + Math.min(mathStats.streak - 1, 4);
        addScore(bonus, bird.x, bird.y - 54);
        nextQuizScoreThreshold = score + MATH_GATE_INTERVAL;
    }

    // Mengembalikan true bila burung selamat (dilindungi shield)
    function resolveMathWrong(qg, slot) {
        qg.resolved = true;
        qg.result = 'WRONG';
        qg.chosenIndex = slot ? slot.index : -1;
        qg.flash = 90;

        mathStats.wrong++;
        mathStats.streak = 0;
        lastMathResult = {
            problem: qg.problem,
            chosenText: slot ? slot.text : '-',
            correct: false,
            hitDivider: !slot
        };
        nextQuizScoreThreshold = score + MATH_GATE_INTERVAL;

        if (activeEffects.shield) {
            activeEffects.shield = false;
            qg.result = 'SAVED';
            audio.sfxShieldBreak();
            audio.sfxWrongBuzz();
            triggerScreenShake(10, 16);
            screenFlashColor = '#00F5D4';
            screenFlashAlpha = 0.45;
            bird.vy = -6;
            floatingTexts.push({
                x: bird.x, y: bird.y - 30,
                text: 'SHIELD ABSORBED ERROR!', color: '#00F5D4', alpha: 1, vy: -1.6
            });
            for (let k = 0; k < 20; k++) {
                const ang = (Math.PI * 2 * k) / 20;
                particles.push({
                    x: bird.x, y: bird.y,
                    vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4,
                    size: 3, color: '#00F5D4', alpha: 1, decay: 0.035
                });
            }
            return true;
        }

        triggerQuizWrongDeath();
        return false;
    }

    // =========================================================================
    // 7. UPDATE LOGIC (PHYSICS, COLLISIONS, TIMERS)
    // =========================================================================
    function update() {
        frameCount++;

        // Decay screen flash & shake
        if (screenFlashAlpha > 0) screenFlashAlpha = Math.max(0, screenFlashAlpha - 0.035);
        if (shakeTimer > 0) shakeTimer--;
        if (stageBannerTimer > 0) stageBannerTimer--;
        if (scorePopScale > 1) scorePopScale = Math.max(1, scorePopScale - 0.04);
        if (menuNotice.timer > 0) menuNotice.timer--;

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.decay;
            if (p.alpha <= 0) particles.splice(i, 1);
        }

        // Update floating score/buff texts
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            const ft = floatingTexts[i];
            ft.y += ft.vy;
            ft.alpha -= 0.022;
            if (ft.alpha <= 0) floatingTexts.splice(i, 1);
        }

        // Update fireworks in Victory state
        if (gameState === 'VICTORY') {
            if (frameCount % 38 === 0) {
                spawnFirework(60 + Math.random() * (LOGICAL_WIDTH - 120), 90 + Math.random() * 280);
            }
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];
                fw.x += fw.vx;
                fw.y += fw.vy;
                fw.vy += 0.06;
                fw.alpha -= 0.018;
                if (fw.alpha <= 0) fireworks.splice(i, 1);
            }
            // Bird hovers victoriously
            bird.y = PLAYABLE_HEIGHT * 0.42 + Math.sin(frameCount * 0.08) * 12;
            bird.rotation = Math.sin(frameCount * 0.08) * 0.1;
            animateBirdWings(0.18);
            scrollBackground(1.8);
            return;
        }

        // Menu or Ready Idle Hover Animation
        if (gameState === 'MENU' || gameState === 'READY') {
            scrollBackground(BASE_SCROLL_SPEED * 0.75);
            bird.y = PLAYABLE_HEIGHT * 0.46 + Math.sin(frameCount * 0.09) * 9;
            bird.rotation = 0;
            animateBirdWings(0.16);
            updateBirdTrail();
            return;
        }

        // Electrocution Death Animation (Wrong Quiz Answer)
        if (gameState === 'DYING_QUIZ') {
            if (bird.electrocutedTimer > 0) {
                bird.electrocutedTimer--;
                // Jitter violently in mid-air while lasers zap the bird
                bird.x = BIRD_X + (Math.random() - 0.5) * 12;
                bird.y += (Math.random() - 0.5) * 10;
                if (frameCount % 3 === 0) {
                    particles.push({
                        x: bird.x + (Math.random() - 0.5) * 24,
                        y: bird.y + (Math.random() - 0.5) * 24,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6,
                        size: 3,
                        color: Math.random() > 0.5 ? '#FF003C' : '#00F5D4',
                        alpha: 1,
                        decay: 0.05
                    });
                }
            } else {
                // Fall burnt and spinning to the cyber floor
                bird.vy += GRAVITY * 1.1;
                bird.y += bird.vy;
                bird.rotation += 0.25;
                if (bird.y + bird.radius >= PLAYABLE_HEIGHT) {
                    bird.y = PLAYABLE_HEIGHT - bird.radius;
                    gameState = 'GAMEOVER';
                }
            }
            return;
        }

        // Normal Crash Death Animation
        if (gameState === 'DYING_NORMAL') {
            bird.vy += GRAVITY * 1.15;
            bird.y += bird.vy;
            bird.rotation = Math.min(Math.PI / 2, bird.rotation + 0.14);
            if (bird.y + bird.radius >= PLAYABLE_HEIGHT) {
                bird.y = PLAYABLE_HEIGHT - bird.radius;
                gameState = 'GAMEOVER';
            }
            return;
        }

        if (gameState !== 'PLAYING') return;

        // =====================================================================
        // ACTIVE PLAYING STATE
        // =====================================================================
        // Decrement active buff/trap timers
        if (activeEffects.slowMo > 0) activeEffects.slowMo--;
        if (activeEffects.shrink > 0) activeEffects.shrink--;
        if (activeEffects.doubleScore > 0) activeEffects.doubleScore--;
        if (activeEffects.gravityInvert > 0) activeEffects.gravityInvert--;

        // Calculate current scroll speed (affected by stage & Chrono Slow buff)
        const baseSpeed = getBaseScrollSpeed(getDifficulty());
        const slowFactor = activeEffects.slowMo > 0 ? 0.58 : 1.0;
        const currentSpeed = baseSpeed * slowFactor;

        scrollBackground(currentSpeed);

        // Bird Physics (Flappy Bird authentic feel + Gravity Anomaly support)
        const gravDir = activeEffects.gravityInvert > 0 ? -0.75 : 1;
        bird.vy += GRAVITY * gravDir * (activeEffects.slowMo > 0 ? 0.85 : 1);
        bird.vy = Math.max(-10.5, Math.min(11.5, bird.vy));
        bird.y += bird.vy;

        // Dynamic Bird Tilt Angle
        if (activeEffects.gravityInvert === 0) {
            if (bird.vy < 0) {
                bird.rotation = -0.42;
            } else {
                bird.rotation = Math.min(Math.PI / 2.2, bird.rotation + 0.055);
            }
        } else {
            bird.rotation = bird.vy > 0 ? 0.42 : -0.42;
        }

        animateBirdWings(bird.vy < 0 ? 0.28 : 0.14);
        updateBirdTrail();

        // Effective collision radius (smaller when Nano Shrink is active)
        const hitRadius = activeEffects.shrink > 0 ? bird.radius * 0.62 : bird.radius * 0.85;

        // Floor & Ceiling Bounds
        if (bird.y + hitRadius >= PLAYABLE_HEIGHT) {
            bird.y = PLAYABLE_HEIGHT - hitRadius;
            triggerNormalDeath();
            return;
        }
        if (bird.y - hitRadius <= 0) {
            bird.y = hitRadius;
            bird.vy = 0;
        }

        // Quiz Warning Countdown -> Spawn Quiz Gate
        if (quizWarningTimer > 0) {
            quizWarningTimer--;
            if (quizWarningTimer > 0 && quizWarningTimer % 32 === 0) audio.sfxGateTick();
            if (quizWarningTimer === 0) {
                spawnQuizGate();
            }
        }

        // Spawn Pipes periodically
        if (nextPipeX !== null) nextPipeX -= currentSpeed;
        for (let guard = 0; guard < 16; guard++) {
            const edgeX = LOGICAL_WIDTH + 30;
            if (nextPipeX === null) {
                nextPipeX = (score === 0 && pipes.length === 0) ? Math.min(edgeX, BIRD_X + 460) : edgeX;
            }
            if (nextPipeX > edgeX) break;
            if (!spawnObstacleWave(nextPipeX)) { nextPipeX = null; break; }
        }

        // Update Pipes & Check Collisions
        for (let i = pipes.length - 1; i >= 0; i--) {
            const p = pipes[i];
            p.x -= currentSpeed;

            // Moving pipe logic
            if (p.isMoving) {
                p.gapTop += p.moveDir * p.moveSpeed * slowFactor;
                if (p.gapTop < 65 || p.gapTop + p.gapHeight > PLAYABLE_HEIGHT - 65) {
                    p.moveDir *= -1;
                }
            }

            // Laser trap cycle (180 frames cycle: 110 safe, 70 active red beam)
            if (p.hasLaserTrap) {
                p.laserTimer = (p.laserTimer + 1) % 180;
            }

            // Score when passing pipe center
            if (!p.passed && p.x + PIPE_WIDTH / 2 < bird.x) {
                p.passed = true;
                addScore(1);
            }

            // AABB vs Circle Collision with Top & Bottom Pipes
            const inPipeX = (bird.x + hitRadius > p.x + 3) && (bird.x - hitRadius < p.x + PIPE_WIDTH - 3);
            if (inPipeX) {
                const hitTop = (bird.y - hitRadius < p.gapTop);
                const hitBottom = (bird.y + hitRadius > p.gapTop + p.gapHeight);

                // Check active EMP Laser beam across gap
                const laserActive = p.hasLaserTrap && p.laserTimer >= 110;
                const beamLen = p.gapHeight * 0.45;
                const inBeamY = p.laserSide === 0
                    ? (bird.y - hitRadius < p.gapTop + beamLen)
                    : (bird.y + hitRadius > p.gapTop + p.gapHeight - beamLen);
                const hitLaser = laserActive && inBeamY && Math.abs(bird.x - (p.x + PIPE_WIDTH / 2)) < hitRadius + 4;

                if (hitTop || hitBottom || hitLaser) {
                    if (activeEffects.shield) {
                        // Consume shield & blast pipe open!
                        activeEffects.shield = false;
                        audio.sfxShieldBreak();
                        triggerScreenShake(8, 14);
                        screenFlashColor = '#00F5D4';
                        screenFlashAlpha = 0.45;
                        floatingTexts.push({
                            x: bird.x, y: bird.y - 20,
                            text: 'SHIELD SAVED!', color: '#00F5D4', alpha: 1, vy: -1.8
                        });
                        // Push pipe away / remove hazard so bird doesn't immediately re-collide
                        pipes.splice(i, 1);
                        continue;
                    } else {
                        triggerNormalDeath();
                        return;
                    }
                }
            }

            if (p.x + PIPE_WIDTH < -40) {
                pipes.splice(i, 1);
            }
        }

        // Update Collectibles (Buffs & Gravity Traps)
        for (let i = collectibles.length - 1; i >= 0; i--) {
            const c = collectibles[i];
            c.x -= currentSpeed;
            c.bobOffset += 0.08;

            const dist = Math.hypot(bird.x - c.x, bird.y - c.y);
            if (!c.collected && dist < hitRadius + c.radius) {
                c.collected = true;
                if (c.kind === 'BUFF') {
                    applyBuff(c.type, c.x, c.y);
                } else if (c.kind === 'TRAP_GRAVITY') {
                    applyGravityTrap(c.x, c.y);
                }
                collectibles.splice(i, 1);
                continue;
            }

            if (c.x < -50) collectibles.splice(i, 1);
        }

        // Update Math Gates
        for (let i = quizGates.length - 1; i >= 0; i--) {
            const qg = quizGates[i];
            qg.age++;
            qg.x -= currentSpeed * qg.speedMul;
            qg.offsetY = qg.bobAmp ? Math.sin(frameCount * 0.045 + qg.bobPhase) * qg.bobAmp : 0;
            if (qg.appear < 1) qg.appear = Math.min(1, qg.appear + 0.04);
            if (qg.flash > 0) {
                qg.flash--;
                if (qg.flash === 0 && activeQuiz === qg.problem) activeQuiz = null;
            }

            if (!qg.resolved) {
                qg.hoverSlot = findGateSlot(qg, bird.y, 0);
                emitGateParticles(qg);

                // Burung masuk ke zona gerbang: jawaban dinilai saat ini
                if (bird.x + hitRadius > qg.x && bird.x - hitRadius < qg.x + qg.width) {
                    const idx = findGateSlot(qg, bird.y, 4);
                    const slot = idx >= 0 ? qg.slots[idx] : null;
                    if (slot && slot.isCorrect) {
                        resolveMathCorrect(qg, slot);
                        if (gameState !== 'PLAYING') return; // kemenangan dipicu oleh poin
                    } else {
                        const survived = resolveMathWrong(qg, slot);
                        if (!survived) return;
                    }
                }
            }

            if (qg.x + qg.width < -60) {
                if (activeQuiz === qg.problem) activeQuiz = null;
                quizGates.splice(i, 1);
            }
        }
    }

    function applyBuff(type, x, y) {
        audio.sfxBuff();
        let label = '';
        let color = '#00F5D4';

        if (type === 'SHIELD') {
            activeEffects.shield = true;
            label = 'CYBER SHIELD!';
            color = '#00F5D4';
        } else if (type === 'SLOWMO') {
            activeEffects.slowMo = 360; // 6 seconds
            label = 'CHRONO SLOW!';
            color = '#38B6FF';
        } else if (type === 'SHRINK') {
            activeEffects.shrink = 420; // 7 seconds
            label = 'NANO SHRINK!';
            color = '#39FF14';
        } else if (type === 'DOUBLE') {
            activeEffects.doubleScore = 480; // 8 seconds
            label = '2X DATA BOOST!';
            color = '#FFE600';
        }

        floatingTexts.push({ x, y: y - 15, text: label, color, alpha: 1, vy: -1.6 });
        for (let i = 0; i < 16; i++) {
            const ang = (Math.PI * 2 * i) / 16;
            particles.push({
                x, y,
                vx: Math.cos(ang) * 3.5,
                vy: Math.sin(ang) * 3.5,
                size: 3, color, alpha: 1, decay: 0.035
            });
        }
    }

    function applyGravityTrap(x, y) {
        audio.sfxTrap();
        activeEffects.gravityInvert = 240; // 4 seconds inverted gravity
        triggerScreenShake(7, 15);
        screenFlashColor = '#9D4EDD';
        screenFlashAlpha = 0.35;
        floatingTexts.push({
            x, y: y - 15,
            text: 'GRAVITY GLITCH!',
            color: '#E0AAFF',
            alpha: 1,
            vy: -1.6
        });
    }

    function scrollBackground(speed) {
        floorOffset = (floorOffset + speed) % 48;

        for (const b of farBuildings) {
            b.x -= speed * 0.22;
            if (b.x + b.w < -20) {
                const maxX = Math.max(...farBuildings.map(item => item.x + item.w));
                b.x = maxX - 5;
            }
        }

        for (const b of nearBuildings) {
            b.x -= speed * 0.48;
            if (b.x + b.w < -20) {
                const maxX = Math.max(...nearBuildings.map(item => item.x + item.w));
                b.x = maxX + 8;
            }
        }

        for (const h of holoSigns) {
            h.x -= speed * 0.48;
            if (h.x < -60) {
                h.x = LOGICAL_WIDTH + 80 + Math.random() * 120;
            }
        }
    }

    function animateBirdWings(rate) {
        bird.wingTimer += rate;
        if (bird.wingTimer >= 1) {
            bird.wingTimer = 0;
            bird.wingFrame = (bird.wingFrame + 1) % 3;
        }
    }

    function updateBirdTrail() {
        bird.trail.unshift({ x: bird.x - 10, y: bird.y });
        if (bird.trail.length > 14) bird.trail.pop();
        for (const t of bird.trail) {
            t.x -= 2.5;
        }
    }

    // =========================================================================
    // 8. RENDERING ENGINE (DETAILED CYBERPUNK PIXEL-VECTOR ART)
    // =========================================================================
    function draw() {
        ctx.save();

        // Apply Camera Shake
        if (shakeTimer > 0) {
            const dx = (Math.random() - 0.5) * shakeIntensity;
            const dy = (Math.random() - 0.5) * shakeIntensity;
            ctx.translate(dx, dy);
        }

        const theme = getTheme();

        // 1. Cyber Sky Gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, PLAYABLE_HEIGHT);
        skyGrad.addColorStop(0, theme.skyTop);
        skyGrad.addColorStop(1, theme.skyBottom);
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, LOGICAL_WIDTH, PLAYABLE_HEIGHT);

        // Synthwave Cyber Grid Horizon / Digital Sun
        drawCyberSunAndStars(theme);

        // 2. Parallax Skyline (Far & Near Buildings + Neon Holograms)
        drawCityscape(theme);

        // 3. Draw Collectibles (Buffs & Gravity Traps)
        drawCollectibles();

        // 4. Draw Cyber Pipes
        drawPipes(theme);

        // 5. Draw Math Panel + Interactive Math Gates
        drawMathPanel();
        drawQuizGates();

        // 6. Draw Animated Cyber Circuit Floor
        drawCyberFloor(theme);

        // 7. Draw Bird Trail & Iconic Cyber Flappy Bird
        drawBird();
        drawAnswerPreview();

        // 8. Draw Particles & Floating Texts
        drawParticlesAndTexts();

        // 9. Active Buff/Trap Status Bars (Top Left/Right)
        if (gameState === 'PLAYING' || gameState === 'DYING_NORMAL' || gameState === 'DYING_QUIZ') {
            ctx.save();
            ctx.translate(UI_OFFSET, 0);
            drawHUD();
            ctx.restore();
        }

        // 10. State Overlays (Menu, Ready, GameOver, Victory)
        ctx.save();
        ctx.translate(UI_OFFSET, 0);
        if (gameState === 'MENU') {
            drawMainMenu();
        } else if (gameState === 'READY') {
            drawGetReadyOverlay();
        } else if (gameState === 'GAMEOVER') {
            drawGameOverModal();
        } else if (gameState === 'VICTORY') {
            drawVictoryModal();
        }
        ctx.restore();

        // Screen Flash Overlay
        if (screenFlashAlpha > 0) {
            ctx.fillStyle = screenFlashColor;
            ctx.globalAlpha = screenFlashAlpha;
            ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
            ctx.globalAlpha = 1;
        }

        ctx.restore();
    }

    function drawCyberSunAndStars(theme) {
        // Twinkling digital stars
        ctx.fillStyle = '#FFFFFF';
        const starCount = Math.ceil(24 * LOGICAL_WIDTH / 450);
        for (let i = 0; i < starCount; i++) {
            const sx = (i * 73 + frameCount * 0.05) % LOGICAL_WIDTH;
            const sy = (i * 41) % (PLAYABLE_HEIGHT * 0.45);
            const alpha = 0.3 + 0.5 * Math.sin(frameCount * 0.05 + i);
            ctx.globalAlpha = alpha;
            ctx.fillRect(sx, sy, 2, 2);
        }
        ctx.globalAlpha = 1;

        // Giant Retro-Cyber Horizon Sun
        const sunX = LOGICAL_WIDTH * 0.72;
        const sunY = PLAYABLE_HEIGHT * 0.34;
        const sunR = 68;
        const sunGrad = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
        sunGrad.addColorStop(0, theme.accentNeon);
        sunGrad.addColorStop(1, 'rgba(255, 0, 128, 0.15)');

        ctx.save();
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
        ctx.fillStyle = sunGrad;
        ctx.fill();

        // Horizontal synthwave scanline cuts across the sun
        ctx.fillStyle = theme.skyBottom;
        for (let y = sunY + 5; y < sunY + sunR; y += 11) {
            ctx.fillRect(sunX - sunR, y, sunR * 2, 3.5);
        }
        ctx.restore();
    }

    function drawCityscape(theme) {
        // Far silhouette towers
        for (const b of farBuildings) {
            const topY = PLAYABLE_HEIGHT - b.h;
            ctx.fillStyle = theme.cityFar;
            ctx.fillRect(b.x, topY, b.w, b.h);
            if (b.antenna) {
                ctx.fillRect(b.x + b.w / 2 - 1, topY - 22, 2, 22);
                ctx.fillStyle = theme.accentNeon;
                ctx.fillRect(b.x + b.w / 2 - 2, topY - 25, 4, 4);
            }
        }

        // Near cyberpunk skyscrapers with glowing windows
        for (const b of nearBuildings) {
            const topY = PLAYABLE_HEIGHT - b.h;
            ctx.fillStyle = theme.cityNear;
            ctx.fillRect(b.x, topY, b.w, b.h);

            // Neon edge trim
            ctx.fillStyle = theme.accentNeon;
            ctx.globalAlpha = 0.25;
            ctx.fillRect(b.x, topY, 2, b.h);
            ctx.globalAlpha = 1;

            // Lit windows
            for (const win of b.litWindows) {
                if (win.blink && Math.sin(frameCount * 0.08 + win.r) < -0.5) continue;
                ctx.fillStyle = theme.accentNeon;
                ctx.globalAlpha = 0.35;
                ctx.fillRect(b.x + 8 + win.c * 13, topY + 10 + win.r * 17, 6, 9);
            }
            ctx.globalAlpha = 1;
        }

        // Floating Neon Hologram Signs
        ctx.font = 'bold 11px "Orbitron", sans-serif';
        ctx.textAlign = 'center';
        for (const h of holoSigns) {
            const floatY = h.y + Math.sin(frameCount * 0.05 + h.x * 0.02) * 4;
            ctx.strokeStyle = h.color;
            ctx.lineWidth = 1;
            ctx.strokeRect(h.x - 24, floatY - 12, 48, 16);
            ctx.fillStyle = h.color;
            ctx.fillText(h.text, h.x, floatY);
        }
    }

    function drawPipes(theme) {
        for (const p of pipes) {
            const topH = p.gapTop;
            const botY = p.gapTop + p.gapHeight;
            const botH = PLAYABLE_HEIGHT - botY;

            // Draw Top Pipe
            drawSingleCyberPipe(p.x, 0, PIPE_WIDTH, topH, true, theme);
            // Draw Bottom Pipe
            drawSingleCyberPipe(p.x, botY, PIPE_WIDTH, botH, false, theme);

            // Draw EMP Laser Trap between pipe lips if present
            if (p.hasLaserTrap) {
                const centerX = p.x + PIPE_WIDTH / 2;
                const active = p.laserTimer >= 110;
                const warning = p.laserTimer >= 75 && p.laserTimer < 110;
                const beamLen = p.gapHeight * 0.45;
                const beamTop = p.laserSide === 0 ? topH : botY - beamLen;
                const beamBot = p.laserSide === 0 ? topH + beamLen : botY;

                // Emitter nodes on pipe lips
                ctx.fillStyle = '#FF003C';
                ctx.fillRect(centerX - 8, topH - 4, 16, 6);
                ctx.fillRect(centerX - 8, botY - 2, 16, 6);

                if (warning) {
                    // Thin targeting laser line
                    ctx.strokeStyle = 'rgba(255, 0, 60, 0.55)';
                    ctx.setLineDash([6, 6]);
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(centerX, beamTop);
                    ctx.lineTo(centerX, beamBot);
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else if (active) {
                    // Deadly high-energy EMP plasma beam
                    ctx.save();
                    ctx.shadowColor = '#FF003C';
                    ctx.shadowBlur = 15;
                    ctx.strokeStyle = '#FF003C';
                    ctx.lineWidth = 8 + Math.sin(frameCount * 0.8) * 2;
                    ctx.beginPath();
                    ctx.moveTo(centerX, beamTop);
                    ctx.lineTo(centerX, beamBot);
                    ctx.stroke();

                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(centerX, beamTop);
                    ctx.lineTo(centerX, beamBot);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }
    }

    function drawSingleCyberPipe(x, y, w, h, isTop, theme) {
        if (h <= 0) return;

        // 1. Main Pipe Shaft with metallic cyber shading (authentic Flappy Bird 3D cylindrical highlight)
        const shaftGrad = ctx.createLinearGradient(x, 0, x + w, 0);
        shaftGrad.addColorStop(0, theme.pipeDark);
        shaftGrad.addColorStop(0.25, theme.pipeLight);
        shaftGrad.addColorStop(0.55, theme.pipeBody);
        shaftGrad.addColorStop(1, theme.pipeDark);

        ctx.fillStyle = shaftGrad;
        ctx.fillRect(x + 4, y, w - 8, h);

        // Dark outer pixel-style border
        ctx.strokeStyle = '#05070F';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x + 4, y, w - 8, h);

        // Glowing Cyber Circuit Lines inside pipe shaft
        ctx.strokeStyle = theme.pipeNeon;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.65;
        ctx.beginPath();
        ctx.moveTo(x + 18, y);
        ctx.lineTo(x + 18, y + h);
        ctx.moveTo(x + w - 18, y);
        ctx.lineTo(x + w - 18, y + h);
        ctx.stroke();
        ctx.globalAlpha = 1;

        // 2. Iconic Flappy Bird Protruding Pipe Lip (Collar)
        const lipH = 28;
        const lipY = isTop ? (y + h - lipH) : y;
        if (h >= lipH) {
            const lipGrad = ctx.createLinearGradient(x, 0, x + w, 0);
            lipGrad.addColorStop(0, theme.pipeDark);
            lipGrad.addColorStop(0.22, theme.pipeLight);
            lipGrad.addColorStop(0.6, theme.pipeBody);
            lipGrad.addColorStop(1, theme.pipeDark);

            ctx.fillStyle = lipGrad;
            ctx.fillRect(x, lipY, w, lipH);

            ctx.strokeStyle = '#05070F';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(x, lipY, w, lipH);

            // Neon LED strip along the pipe collar
            ctx.fillStyle = theme.pipeNeon;
            ctx.shadowColor = theme.pipeNeon;
            ctx.shadowBlur = 8;
            ctx.fillRect(x + 6, lipY + lipH / 2 - 2, w - 12, 4);
            ctx.shadowBlur = 0;
        }
    }

    function drawCollectibles() {
        for (const c of collectibles) {
            const drawY = c.y + Math.sin(c.bobOffset) * 5;
            ctx.save();
            ctx.translate(c.x, drawY);

            if (c.kind === 'BUFF') {
                const colors = {
                    SHIELD: '#00F5D4',
                    SLOWMO: '#38B6FF',
                    SHRINK: '#39FF14',
                    DOUBLE: '#FFE600'
                };
                const icons = {
                    SHIELD: 'S',
                    SLOWMO: 'T',
                    SHRINK: 'M',
                    DOUBLE: '2X'
                };
                const col = colors[c.type] || '#00F5D4';

                // Outer rotating hexagon/ring
                ctx.rotate(frameCount * 0.04);
                ctx.strokeStyle = col;
                ctx.lineWidth = 2.5;
                ctx.shadowColor = col;
                ctx.shadowBlur = 12;
                ctx.strokeRect(-13, -13, 26, 26);
                ctx.rotate(-frameCount * 0.04);

                ctx.fillStyle = 'rgba(10, 15, 30, 0.85)';
                ctx.fillRect(-11, -11, 22, 22);

                ctx.fillStyle = col;
                ctx.font = 'bold 12px "Orbitron", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(icons[c.type], 0, 1);
            } else if (c.kind === 'TRAP_GRAVITY') {
                // Swirling Purple Gravity Anomaly Vortex
                ctx.rotate(-frameCount * 0.09);
                ctx.strokeStyle = '#C77DFF';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#9D4EDD';
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(0, 0, c.radius, 0, Math.PI * 1.5);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, c.radius * 0.6, Math.PI * 0.5, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#E0AAFF';
                ctx.font = 'bold 10px "Orbitron", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.rotate(frameCount * 0.09);
                ctx.fillText('!G!', 0, 0);
            }
            ctx.restore();
        }
    }

    // ---- Menggambar persamaan berwarna dari token soal ----
    // opts.revealCount : jumlah token yang sudah "didekripsi" (sisanya acak)
    // opts.solvedValue : bila ada, tanda ? diganti jawaban berwarna hijau
    function drawEquation(tokens, cx, baseY, maxW, fontPx, opts) {
        opts = opts || {};
        const reveal = opts.revealCount === undefined ? tokens.length : opts.revealCount;
        const solvedValue = opts.solvedValue;
        const scramble = '#%&@$01<>';

        const disp = tokens.map((tk, i) => {
            if (i >= reveal) {
                let s = '';
                for (let c = 0; c < tk.t.length; c++) {
                    s += scramble[(Math.floor(frameCount / 2) + i * 7 + c * 3) % scramble.length];
                }
                return s;
            }
            if (tk.k === 'q' && solvedValue !== undefined) return String(solvedValue);
            return tk.t;
        });

        const gapOf = (i) => {
            if (i === 0) return 0;
            const prev = tokens[i - 1], cur = tokens[i];
            if ((prev.k === 'paren' && prev.t === '(') || (cur.k === 'paren' && cur.t === ')')) return 0.15;
            return 0.7;
        };
        const fontOf = (s) => 'bold ' + s + 'px "Press Start 2P", monospace';
        const measure = (s) => {
            ctx.font = fontOf(s);
            let total = 0;
            disp.forEach((d, i) => { total += ctx.measureText(d).width + gapOf(i) * s; });
            return total;
        };

        ctx.save();
        let size = fontPx;
        let total = measure(size);
        if (total > maxW) {
            size = Math.max(9, size * maxW / total);
            total = measure(size);
        }
        ctx.font = fontOf(size);
        ctx.textAlign = 'left';

        let x = cx - total / 2;
        const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.2);
        disp.forEach((d, i) => {
            x += gapOf(i) * size;
            const tk = tokens[i];
            const w = ctx.measureText(d).width;
            let color = '#E0FBFC';
            let glow = 0;
            if (i >= reveal) {
                color = '#475569';
            } else if (tk.k === 'op') {
                color = tk.c; glow = 10;
            } else if (tk.k === 'paren') {
                color = '#94A3B8';
            } else if (tk.k === 'eq') {
                color = '#CBD5E1';
            } else if (tk.k === 'q') {
                if (solvedValue !== undefined) {
                    color = '#39FF14'; glow = 12;
                } else {
                    color = pulse > 0.5 ? '#FFE600' : '#00F5D4';
                    glow = 12;
                    ctx.fillStyle = 'rgba(255, 230, 0, ' + (0.08 + 0.10 * pulse) + ')';
                    ctx.fillRect(x - 4, baseY - size - 3, w + 8, size + 10);
                }
            }
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = glow;
            ctx.fillText(d, x, baseY);
            ctx.shadowBlur = 0;
            x += w;
        });
        ctx.restore();
    }

    function drawFlame(cx, by, s) {
        const f = 1 + Math.sin(frameCount * 0.35) * 0.08;
        ctx.save();
        ctx.translate(cx, by);
        ctx.scale(s * f, s * f);
        ctx.fillStyle = '#FF8A00';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-9, -2, -9, -12, -2, -18);
        ctx.bezierCurveTo(-2, -11, 2, -10, 3, -14);
        ctx.bezierCurveTo(8, -9, 9, -2, 0, 0);
        ctx.fill();
        ctx.fillStyle = '#FFE600';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-4, -1, -4, -6, 0, -9);
        ctx.bezierCurveTo(4, -6, 4, -1, 0, 0);
        ctx.fill();
        ctx.restore();
    }

    function drawLightning(x1, y1, x2, y2, color, segs) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        for (let i = 1; i < segs; i++) {
            const t = i / segs;
            ctx.lineTo(x1 + (x2 - x1) * t + (Math.random() - 0.5) * 22,
                       y1 + (y2 - y1) * t + (Math.random() - 0.5) * 22);
        }
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
    }

    // Balok laser pembatas gerbang dengan aliran energi
    function drawGateBar(x, y, w, h, color, t) {
        const g = ctx.createLinearGradient(0, y, 0, y + h);
        g.addColorStop(0, '#0B1030');
        g.addColorStop(0.5, '#1E1B4B');
        g.addColorStop(1, '#0B1030');
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);

        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 10]);
        ctx.lineDashOffset = -t * 1.6;
        const my = Math.max(y, Math.min(y + h, y + (h > 60 ? 30 : h / 2)));
        ctx.beginPath();
        ctx.moveTo(x, my);
        ctx.lineTo(x + w, my);
        ctx.stroke();
        ctx.restore();
    }

    function drawBrackets(x, y, w, h, len) {
        ctx.beginPath();
        ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
        ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
        ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h);
        ctx.moveTo(x + len, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - len);
        ctx.stroke();
    }

    function drawQuizGates() {
        const t = frameCount;
        for (const qg of quizGates) {
            if (qg.x > LOGICAL_WIDTH + 120) continue;
            const A = qg.appear;
            const x = qg.x, w = qg.width, bh = qg.barrierHeight;
            const resolved = qg.resolved;

            ctx.save();
            const jitter = A < 1 ? (Math.random() - 0.5) * 12 * (1 - A) : 0;
            ctx.translate(jitter, qg.offsetY);
            ctx.globalAlpha = A;

            // Kolom cahaya di belakang gerbang
            const glow = ctx.createLinearGradient(x - 24, 0, x + w + 24, 0);
            glow.addColorStop(0, 'rgba(0, 245, 212, 0)');
            glow.addColorStop(0.5, 'rgba(0, 245, 212, 0.10)');
            glow.addColorStop(1, 'rgba(0, 245, 212, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(x - 24, -40, w + 48, PLAYABLE_HEIGHT + 80);

            // Pembatas atas & antar slot
            drawGateBar(x, -40, w, bh + 40, '#00F5D4', t);
            qg.slots.forEach((slot, i) => {
                const isLast = i === qg.slots.length - 1;
                drawGateBar(x, slot.bottomY, w, bh + (isLast ? 40 : 0), '#FF2A6D', t);
            });

            // Panel jawaban holografik
            for (const slot of qg.slots) {
                const sx = x + 3, sy = slot.topY + 2, sw = w - 6, sh = slot.bottomY - slot.topY - 4;
                const isChosen = qg.chosenIndex === slot.index;
                const isHover = !resolved && qg.hoverSlot === slot.index;
                const hot = resolved && (slot.isCorrect || isChosen);
                const midY = (slot.topY + slot.bottomY) / 2;
                const cx = x + w / 2;
                let col = slot.color;
                let dim = 1;
                if (resolved) {
                    if (slot.isCorrect) col = '#39FF14';
                    else if (isChosen) col = '#FF003C';
                    else dim = 0.35;
                }

                ctx.save();
                ctx.globalAlpha = A * dim;
                const pg = ctx.createLinearGradient(sx, sy, sx + sw, sy + sh);
                pg.addColorStop(0, 'rgba(8, 14, 40, 0.82)');
                pg.addColorStop(1, 'rgba(24, 10, 54, 0.82)');
                ctx.fillStyle = pg;
                ctx.fillRect(sx, sy, sw, sh);

                // Warna slot (lebih terang saat disorot burung / sudah dinilai)
                ctx.globalAlpha = A * dim * ((isHover ? 0.30 : 0.10) + (hot ? 0.16 + 0.12 * Math.sin(t * 0.4) : 0));
                ctx.fillStyle = col;
                ctx.fillRect(sx, sy, sw, sh);

                // Garis pindai bergerak
                ctx.globalAlpha = A * dim * 0.35;
                ctx.fillRect(sx, sy + ((t * 1.3 + slot.index * 47) % sh), sw, 2);

                // Bingkai neon + sudut
                ctx.globalAlpha = A * dim;
                ctx.strokeStyle = col;
                ctx.lineWidth = (isHover || hot) ? 3 : 1.5;
                ctx.shadowColor = col;
                ctx.shadowBlur = (isHover || hot) ? 14 : 6;
                ctx.strokeRect(sx, sy, sw, sh);
                ctx.shadowBlur = 0;
                ctx.lineWidth = 2;
                drawBrackets(sx + 2, sy + 2, sw - 4, sh - 4, 7);

                // Lencana huruf
                ctx.fillStyle = col;
                ctx.beginPath();
                ctx.arc(cx, midY - 20, 11, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#050510';
                ctx.font = 'bold 11px "Press Start 2P", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(slot.label, cx + 1, midY - 16);

                // Nilai jawaban
                const len = slot.text.length;
                const fs = len >= 4 ? 15 : (len === 3 ? 18 : 22);
                ctx.font = 'bold ' + fs + 'px "Orbitron", sans-serif';
                ctx.fillStyle = hot ? col : '#FFFFFF';
                ctx.shadowColor = col;
                ctx.shadowBlur = hot ? 14 : 8;
                ctx.fillText(slot.text, cx, midY + 18, sw - 6);
                ctx.shadowBlur = 0;

                // Penanda panah saat burung berada di slot ini
                if (isHover) {
                    ctx.strokeStyle = col;
                    ctx.lineWidth = 3;
                    const bob = Math.sin(t * 0.3) * 3;
                    for (let c = 0; c < 2; c++) {
                        const px = x - 12 - c * 9 + bob;
                        ctx.beginPath();
                        ctx.moveTo(px - 5, midY - 8);
                        ctx.lineTo(px, midY);
                        ctx.lineTo(px - 5, midY + 8);
                        ctx.stroke();
                    }
                }

                // Ikon centang / silang setelah dinilai
                if (resolved && (slot.isCorrect || isChosen)) {
                    ctx.strokeStyle = col;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    const ix = sx + sw - 12, iy = sy + 13;
                    if (slot.isCorrect) {
                        ctx.moveTo(ix - 6, iy); ctx.lineTo(ix - 2, iy + 5); ctx.lineTo(ix + 6, iy - 5);
                    } else {
                        ctx.moveTo(ix - 5, iy - 5); ctx.lineTo(ix + 5, iy + 5);
                        ctx.moveTo(ix + 5, iy - 5); ctx.lineTo(ix - 5, iy + 5);
                    }
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Efek hasil jawaban
            if (resolved && qg.flash > 0) {
                const chosen = qg.chosenIndex >= 0 ? qg.slots[qg.chosenIndex] : null;
                const cy = chosen ? (chosen.topY + chosen.bottomY) / 2 : bird.y - qg.offsetY;
                if (qg.result === 'WRONG') {
                    drawLightning(x + w / 2, cy, bird.x, bird.y - qg.offsetY, '#FF003C', 7);
                    drawLightning(x + w / 2, cy, bird.x, bird.y - qg.offsetY, '#FFFFFF', 5);
                } else {
                    const total = qg.result === 'CORRECT' ? 70 : 90;
                    const prog = 1 - qg.flash / total;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, 1 - prog);
                    ctx.strokeStyle = qg.result === 'CORRECT' ? '#39FF14' : '#00F5D4';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(x + w / 2, cy, 12 + prog * 90, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }
            ctx.restore();
        }
    }

    // Panel soal di atas layar (digambar di belakang gerbang agar jawaban tetap terbaca)
    function drawMathPanel() {
        if (!activeQuiz) return;
        if (gameState !== 'PLAYING' && gameState !== 'DYING_QUIZ' && gameState !== 'DYING_NORMAL') return;

        const p = activeQuiz;
        const qg = quizGates.find(g => g.problem === p) || null;
        const warning = quizWarningTimer > 0;
        const resolved = !!(qg && qg.resolved);
        const pw = Math.min(UI_W - 36, 410);
        const ph = 72;
        const px = UI_OFFSET + (UI_W - pw) / 2;
        const py = 80;

        let alpha = 1;
        if (warning) alpha = Math.min(1, (quizWarningMax - quizWarningTimer + 1) / 14);
        else if (resolved && gameState === 'PLAYING') alpha = Math.min(1, qg.flash / 25);
        if (alpha <= 0) return;

        let border = p.tierInfo.color;
        if (warning) border = Math.floor(frameCount / 8) % 2 === 0 ? '#FF003C' : '#FFE600';
        else if (qg && qg.result === 'CORRECT') border = '#39FF14';
        else if (qg && qg.result === 'WRONG') border = '#FF003C';
        else if (qg && qg.result === 'SAVED') border = '#00F5D4';

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgba(6, 10, 30, 0.90)';
        ctx.strokeStyle = border;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = border;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.roundRect(px, py, pw, ph, 12);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Baris 1: tier & jenis soal
        ctx.font = 'bold 9px "Orbitron", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillStyle = p.tierInfo.color;
        ctx.fillText('LV.' + (p.tier + 1) + ' ' + p.tierInfo.name, px + 12, py + 17);
        ctx.textAlign = 'right';
        if (warning) {
            ctx.fillStyle = Math.floor(frameCount / 10) % 2 === 0 ? '#FFE600' : '#FF8FA3';
            ctx.fillText('DECRYPTING...', px + pw - 12, py + 17);
        } else {
            ctx.fillStyle = '#94A3B8';
            ctx.fillText(p.kindLabel, px + pw - 12, py + 17);
        }

        // Baris 2: persamaan
        let revealCount;
        if (warning) {
            const prog = (quizWarningMax - quizWarningTimer) / (quizWarningMax * 0.6);
            revealCount = Math.floor(prog * p.tokens.length);
        }
        drawEquation(p.tokens, px + pw / 2, py + 52, pw - 28, 20, {
            revealCount: revealCount,
            solvedValue: resolved ? p.value : undefined
        });

        // Baris 3: bar waktu / jarak gerbang
        let frac, barColor;
        if (warning) {
            frac = quizWarningTimer / quizWarningMax;
            barColor = border;
        } else if (!resolved && qg) {
            frac = Math.max(0, Math.min(1, (qg.x - BIRD_X) / qg.spawnDist));
            barColor = '#FFE600';
        } else {
            frac = 1;
            barColor = border;
        }
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.fillRect(px + 12, py + ph - 10, pw - 24, 4);
        ctx.fillStyle = barColor;
        ctx.fillRect(px + 12, py + ph - 10, (pw - 24) * frac, 4);
        ctx.restore();
    }

    // Pil kecil di atas burung: jawaban yang akan terpilih bila lurus masuk gerbang
    function drawAnswerPreview() {
        if (gameState !== 'PLAYING') return;
        const qg = quizGates.find(g => !g.resolved && g.hoverSlot >= 0 && g.x - bird.x < 300 && g.x > bird.x - 20);
        if (!qg) return;
        const slot = qg.slots[qg.hoverSlot];
        const text = slot.label + ' = ' + slot.text;

        ctx.save();
        ctx.font = 'bold 12px "Orbitron", sans-serif';
        ctx.textAlign = 'center';
        const tw = ctx.measureText(text).width + 18;
        const bx = Math.max(4, Math.min(LOGICAL_WIDTH - tw - 4, bird.x - tw / 2));
        const by = Math.max(4, bird.y - 52);
        ctx.fillStyle = 'rgba(5, 8, 22, 0.88)';
        ctx.strokeStyle = slot.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(bx, by, tw, 22, 8);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(bird.x - 5, by + 22);
        ctx.lineTo(bird.x + 5, by + 22);

    function drawCyberFloor(theme) {
        const y = PLAYABLE_HEIGHT;

        // Base dark tech floor
        ctx.fillStyle = '#090D1E';
        ctx.fillRect(0, y, LOGICAL_WIDTH, FLOOR_HEIGHT);

        // Top glowing neon border line
        ctx.fillStyle = theme.accentNeon;
        ctx.shadowColor = theme.accentNeon;
        ctx.shadowBlur = 10;
        ctx.fillRect(0, y, LOGICAL_WIDTH, 4);
        ctx.shadowBlur = 0;

        // Classic Flappy Bird diagonal moving chevron stripes (Cyber style)
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, y + 4, LOGICAL_WIDTH, 22);
        ctx.clip();

        ctx.fillStyle = '#16213E';
        ctx.fillRect(0, y + 4, LOGICAL_WIDTH, 22);

        ctx.fillStyle = theme.accentNeon;
        ctx.globalAlpha = 0.65;
        for (let sx = -48; sx < LOGICAL_WIDTH + 48; sx += 48) {
            const drawX = sx - floorOffset;
            ctx.beginPath();
            ctx.moveTo(drawX, y + 26);
            ctx.lineTo(drawX + 16, y + 4);
            ctx.lineTo(drawX + 32, y + 4);
            ctx.lineTo(drawX + 16, y + 26);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();

        // Perspective Synthwave Grid on lower floor
        ctx.strokeStyle = theme.accentNeon;
        ctx.globalAlpha = 0.22;
        ctx.lineWidth = 1.5;
        for (let gx = -48; gx < LOGICAL_WIDTH + 96; gx += 48) {
            const drawX = gx - floorOffset;
            ctx.beginPath();
            ctx.moveTo(drawX, y + 26);
            ctx.lineTo(drawX - 24, LOGICAL_HEIGHT);
            ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(0, y + 55);
        ctx.lineTo(LOGICAL_WIDTH, y + 55);
        ctx.moveTo(0, y + 85);
        ctx.lineTo(LOGICAL_WIDTH, y + 85);
        ctx.stroke();
        ctx.globalAlpha = 1;
    }

    function drawBird() {
        const skin = BIRD_SKINS[selectedSkinIndex];

        // 1. Draw Neon Motion Trail
        for (let i = 0; i < bird.trail.length; i++) {
            const pt = bird.trail[i];
            const ratio = 1 - i / bird.trail.length;
            ctx.fillStyle = skin.trailColor;
            ctx.globalAlpha = ratio * 0.45;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, bird.radius * 0.55 * ratio, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(bird.rotation);

        // Apply Nano Shrink visual scale
        const scale = activeEffects.shrink > 0 ? 0.62 : 1.0;
        ctx.scale(scale, scale);

        // If bird is charred from wrong quiz electrocution
        const bodyMain = bird.charred ? '#2B2D42' : skin.bodyMain;
        const bodyShade = bird.charred ? '#14151F' : skin.bodyShade;
        const bodyHighlight = bird.charred ? '#4A4E69' : skin.bodyHighlight;

        // 2. Iconic Flappy Bird Round Body (Pixel-Vector Layered Shading)
        ctx.fillStyle = bodyMain;
        ctx.beginPath();
        ctx.ellipse(0, 0, 19, 15, 0, 0, Math.PI * 2);
        ctx.fill();

        // Bottom shading
        ctx.fillStyle = bodyShade;
        ctx.beginPath();
        ctx.ellipse(0, 5, 17, 9, 0, 0, Math.PI);
        ctx.fill();

        // Top highlight
        ctx.fillStyle = bodyHighlight;
        ctx.beginPath();
        ctx.ellipse(-2, -7, 11, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Dark Outline (Classic Flappy Bird crisp silhouette)
        ctx.strokeStyle = '#080812';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.ellipse(0, 0, 19, 15, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Cyber Circuit Line on body
        ctx.strokeStyle = skin.visorColor;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-14, 2);
        ctx.lineTo(-6, 2);
        ctx.lineTo(-3, 6);
        ctx.stroke();

        // 3. Large Iconic Flappy Eye + Cyber Visor Lens
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(7, -5, 6.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#080812';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Pupil (or X-eye if dead!)
        if (gameState === 'DYING_NORMAL' || gameState === 'DYING_QUIZ' || gameState === 'GAMEOVER') {
            ctx.strokeStyle = '#FF003C';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(6, -7); ctx.lineTo(11, -2);
            ctx.moveTo(11, -7); ctx.lineTo(6, -2);
            ctx.stroke();
        } else {
            ctx.fillStyle = '#080812';
            ctx.beginPath();
            ctx.arc(9.5, -5, 2.6, 0, Math.PI * 2);
            ctx.fill();

            // Glowing Cyber Visor Strip across eye
            ctx.fillStyle = skin.visorColor;
            ctx.globalAlpha = 0.55;
            ctx.fillRect(2, -8, 12, 4.5);
            ctx.globalAlpha = 1;
        }

        // 4. Iconic Thick Two-Part Flappy Beak
        // Upper Lip
        ctx.fillStyle = skin.beakTop;
        ctx.beginPath();
        ctx.roundRect(11, -1, 13, 6, 3);
        ctx.fill();
        ctx.strokeStyle = '#080812';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Lower Lip
        ctx.fillStyle = skin.beakBottom;
        ctx.beginPath();
        ctx.roundRect(11, 4.5, 11, 5, 3);
        ctx.fill();
        ctx.stroke();

        // 5. Animated 3-Frame Flappy Wing
        const wingOffsets = [-3, 2, 6]; // Up, Mid, Down
        const wy = wingOffsets[bird.wingFrame];
        ctx.fillStyle = skin.wingColor;
        ctx.beginPath();
        ctx.ellipse(-6, wy, 9.5, 6, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#080812';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 6. Active Cyber Shield Bubble
        if (activeEffects.shield) {
            ctx.strokeStyle = '#00F5D4';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#00F5D4';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(0, 0, 26 + Math.sin(frameCount * 0.15) * 2, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(0, 245, 212, 0.14)';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        ctx.restore();
    }

    function drawParticlesAndTexts() {
        for (const p of particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        }
        ctx.globalAlpha = 1;

        for (const fw of fireworks) {
            ctx.fillStyle = fw.color;
            ctx.globalAlpha = Math.max(0, fw.alpha);
            ctx.beginPath();
            ctx.arc(fw.x, fw.y, fw.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.font = 'bold 14px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        for (const ft of floatingTexts) {
            ctx.globalAlpha = Math.max(0, ft.alpha);
            ctx.fillStyle = '#000000';
            ctx.fillText(ft.text, ft.x + 2, ft.y + 2);
            ctx.fillStyle = ft.color;
            ctx.fillText(ft.text, ft.x, ft.y);
        }
        ctx.globalAlpha = 1;
    }

            ctx.fillText('REVIEW SOAL // LV.' + (res.problem.tier + 1) + ' ' + res.problem.tierInfo.name,
                         UI_W / 2, ry + 16, rw - 16);

            drawEquation(res.problem.tokens, UI_W / 2, ry + 46, rw - 16, 17, { solvedValue: res.problem.value });

            ctx.textAlign = 'center';
            ctx.font = 'bold 11px "Orbitron", sans-serif';
            ctx.fillStyle = '#FF8FA3';
            ctx.fillText(res.hitDivider ? 'KAMU MENABRAK PEMBATAS GERBANG' : 'JAWABANMU: ' + res.chosenText,
                         UI_W / 2, ry + 69, rw - 16);
            ctx.fillStyle = '#39FF14';
            ctx.fillText('JAWABAN BENAR: ' + res.problem.value, UI_W / 2, ry + 87, rw - 16);
        }

        // Medal Calculation (Authentic Flappy Bird Medal Tiers)
        let medalName = 'NO MEDAL';
        let medalColor = '#475569';
        if (score >= 40) { medalName = 'CYBER PLATINUM'; medalColor = '#00F5D4'; }
        else if (score >= 25) { medalName = 'GOLD CORE'; medalColor = '#FFE600'; }
        else if (score >= 12) { medalName = 'SILVER NODE'; medalColor = '#E2E8F0'; }
        else if (score >= 5) { medalName = 'BRONZE CHIP'; medalColor = '#CD7F32'; }

        // Medal Circle (Left side of scoreboard)
        const medalX = bx + 85;
        const medalY = y0 + 155;
        ctx.fillStyle = '#1E293B';
        ctx.beginPath();
        ctx.arc(medalX, medalY, 36, 0, Math.PI * 2);
        ctx.fill();

        if (score >= 5) {
            ctx.fillStyle = medalColor;
            ctx.shadowColor = medalColor;
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(medalX, medalY, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#050510';
            ctx.font = 'bold 16px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('★', medalX, medalY + 6);
        }

        ctx.textAlign = 'center';
        ctx.fillStyle = medalColor;
        ctx.font = 'bold 9px "Orbitron", sans-serif';
        ctx.fillText(medalName, medalX, medalY + 52);

        // Score & High Score Stats (Right side)
        const statX = bx + 245;
        ctx.fillStyle = '#94A3B8';
        ctx.font = 'bold 11px "Orbitron", sans-serif';
        ctx.fillText('SCORE', statX, y0 + 122);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 24px "Press Start 2P", monospace';
        ctx.fillText(score.toString(), statX, y0 + 152);

        ctx.fillStyle = '#FFE600';
        ctx.font = 'bold 11px "Orbitron", sans-serif';
        ctx.fillText(isNewHighScore ? 'NEW BEST!' : 'BEST SCORE', statX, y0 + 185);

        ctx.fillStyle = '#FFE600';
        ctx.font = 'bold 22px "Press Start 2P", monospace';
        ctx.fillText(highScore.toString(), statX, y0 + 214);

        // Statistik matematika
        if (mathStats.solved + mathStats.wrong > 0) {
            ctx.fillStyle = '#00F5D4';
            ctx.font = 'bold 10px "Orbitron", sans-serif';
            ctx.fillText('MATH: ' + mathStats.solved + ' BENAR  |  COMBO TERBAIK: x' + mathStats.bestStreak,
                         UI_W / 2, y0 + 238, boxW - 24);
        }

        // Action Buttons: PLAY AGAIN & MAIN MENU
        const restartBtn = { x: bx + 28, y: y0 + 252, w: boxW - 56, h: 48 };
        const menuBtn = { x: bx + 28, y: y0 + 312, w: boxW - 56, h: 44 };
        uiButtons.restartBtn = restartBtn;
        uiButtons.menuBtn = menuBtn;

        // Play Again Button
        ctx.fillStyle = '#00F5D4';
        ctx.beginPath();
        ctx.roundRect(restartBtn.x, restartBtn.y, restartBtn.w, restartBtn.h, 12);
        ctx.fill();
        ctx.fillStyle = '#050510';
        ctx.font = 'bold 14px "Press Start 2P", monospace';
        ctx.fillText('PLAY AGAIN', UI_W / 2, restartBtn.y + 31);

        // Main Menu Button
        ctx.fillStyle = '#1E293B';
        ctx.strokeStyle = '#64748B';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(menuBtn.x, menuBtn.y, menuBtn.w, menuBtn.h, 12);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#E2E8F0';
        ctx.font = 'bold 12px "Orbitron", sans-serif';
        ctx.fillText('MAIN MENU', UI_W / 2, menuBtn.y + 27);
    }

    function drawVictoryModal() {
        ctx.fillStyle = 'rgba(5, 6, 18, 0.65)';
        ctx.fillRect(-UI_OFFSET, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        const boxW = Math.min(365, UI_W - 24);
        const boxH = 360;
        const bx = (UI_W - boxW) / 2;
        const by = 195;

        ctx.fillStyle = '#0F172A';
        ctx.strokeStyle = '#FFE600';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#FFE600';
        ctx.shadowBlur = 24;
        ctx.beginPath();
        ctx.roundRect(bx, by, boxW, boxH, 18);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.fillStyle = '#FFE600';
        ctx.font = 'bold 22px "Press Start 2P", monospace';
        ctx.fillText('SYSTEM CLEARED!', UI_W / 2, by + 50, boxW - 24);

        ctx.fillStyle = '#00F5D4';
        ctx.font = 'bold 12px "Orbitron", sans-serif';
        ctx.fillText('SEMUA 5 SEKTOR CYBER BERHASIL DITAKLUKKAN!', UI_W / 2, by + 80, boxW - 24);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 28px "Press Start 2P", monospace';
        ctx.fillText(`SCORE: ${score}`, UI_W / 2, by + 135);

        ctx.fillStyle = '#39FF14';
        ctx.font = 'bold 12px "Orbitron", sans-serif';
        ctx.fillText(`HIGH SCORE: ${highScore}`, UI_W / 2, by + 165);

        ctx.fillStyle = '#00F5D4';
        ctx.font = 'bold 10px "Orbitron", sans-serif';
        ctx.fillText('MATH: ' + mathStats.solved + ' BENAR  |  COMBO TERBAIK: x' + mathStats.bestStreak,
                     UI_W / 2, by + 186, boxW - 24);

        // Endless Mode Button
        const endlessBtn = { x: bx + 28, y: by + 195, w: boxW - 56, h: 48 };
        const menuBtn = { x: bx + 28, y: by + 258, w: boxW - 56, h: 44 };
        uiButtons.endlessBtn = endlessBtn;
        uiButtons.menuBtn = menuBtn;

        ctx.fillStyle = '#FFE600';
        ctx.beginPath();
        ctx.roundRect(endlessBtn.x, endlessBtn.y, endlessBtn.w, endlessBtn.h, 12);
        ctx.fill();
        ctx.fillStyle = '#050510';
        ctx.font = 'bold 12px "Press Start 2P", monospace';
        ctx.fillText('ENDLESS MODE', UI_W / 2, endlessBtn.y + 30);

        ctx.fillStyle = '#1E293B';
        ctx.strokeStyle = '#00F5D4';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(menuBtn.x, menuBtn.y, menuBtn.w, menuBtn.h, 12);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#00F5D4';
        ctx.font = 'bold 12px "Orbitron", sans-serif';
        ctx.fillText('MAIN MENU', UI_W / 2, menuBtn.y + 27);
    }

    // =========================================================================
    // 10. INPUT HANDLING (MOUSE, TOUCH & KEYBOARD)
    // =========================================================================
    function getLogicalCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const x = ((clientX - rect.left) / rect.width) * LOGICAL_WIDTH;
        const y = ((clientY - rect.top) / rect.height) * LOGICAL_HEIGHT;
        return { x, y };
    }

    function isInside(pt, rect) {
        return pt.x >= rect.x && pt.x <= rect.x + rect.w &&
               pt.y >= rect.y && pt.y <= rect.y + rect.h;
    }

    function handlePointerInput(clientX, clientY) {
        audio.init();
        const pt = getLogicalCoords(clientX, clientY);
        pt.x -= UI_OFFSET;

        if (gameState === 'MENU') {
            // Check Audio Toggle
            if (isInside(pt, uiButtons.audioBtn)) {
                audio.toggle();
                audio.sfxClick();
                return;
            }
            // Check Math Operation Toggles
            for (const oBtn of uiButtons.opBtns) {
                if (isInside(pt, oBtn)) {
                    tryToggleMathOp(oBtn.id);
                    return;
                }
            }
            // Check Skin Selection
            for (const sBtn of uiButtons.skinBtns) {
                if (isInside(pt, sBtn)) {
                    selectedSkinIndex = sBtn.index;
                    audio.sfxClick();
                    return;
                }
            }
            // Check Start Button
            if (isInside(pt, uiButtons.startBtn)) {
                audio.sfxClick();
                resetGameToReady();
                return;
            }
        } else if (gameState === 'READY' || gameState === 'PLAYING') {
            flapBird();
        } else if (gameState === 'GAMEOVER') {
            if (isInside(pt, uiButtons.restartBtn)) {
                audio.sfxClick();
                resetGameToReady();
            } else if (isInside(pt, uiButtons.menuBtn)) {
                audio.sfxClick();
                gameState = 'MENU';
            }
        } else if (gameState === 'VICTORY') {
            if (isInside(pt, uiButtons.endlessBtn)) {
                audio.sfxClick();
                endlessMode = true;
                gameState = 'PLAYING';
                stageBannerText = 'ENDLESS OVERDRIVE ACTIVATED!';
                stageBannerTimer = 140;
                audio.startBgm();
            } else if (isInside(pt, uiButtons.menuBtn)) {
                audio.sfxClick();
                gameState = 'MENU';
            }
        }
    }

    // Cegah seleksi/menu konteks yang memicu sorotan biru di browser
    ['contextmenu', 'selectstart', 'dragstart'].forEach(ev => {
        document.addEventListener(ev, (e) => e.preventDefault());
    });

    canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        handlePointerInput(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length > 0) {
            handlePointerInput(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
        if (gameState === 'MENU') {
            const m = /^(Digit|Numpad)([1-4])$/.exec(e.code);
            if (m) {
                tryToggleMathOp(MATH_OP_ORDER[parseInt(m[2], 10) - 1]);
                return;
            }
        }
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            e.preventDefault();
            audio.init();
            if (gameState === 'MENU') {
                resetGameToReady();
            } else if (gameState === 'READY' || gameState === 'PLAYING') {
                flapBird();
            } else if (gameState === 'GAMEOVER') {
                resetGameToReady();
            }
        }
    });

    // =========================================================================
    // 11. MAIN GAME LOOP
    // =========================================================================
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Start loop immediately on load
    requestAnimationFrame(gameLoop);
})();
</script>

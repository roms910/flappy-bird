<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050510">
  <meta name="description" content="Cyber Flappy PRO Online — arcade cyberpunk dengan akun, leaderboard, dan kosmetik RCoin.">
  <title>CYBER FLAPPY // ONLINE EDITION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/game.css">
  <link rel="stylesheet" href="./css/online.css">
</head>
<body>
  <main id="game-wrapper" aria-label="Cyber Flappy game">
    <canvas id="gameCanvas" aria-label="Area permainan Cyber Flappy" tabindex="0"></canvas>
    <div class="crt-overlay" aria-hidden="true"></div>
  </main>
  <header class="online-bar">
    <div class="brand">CF<span> // ONLINE</span></div>
    <div class="online-actions">
      <span id="coin-balance" class="coin-pill">◈ -- RCoin</span>
      <button id="leaderboard-open" class="nav-btn">🏆 <span>Rank</span></button>
      <button id="shop-open" class="nav-btn">🛒 <span>Shop</span></button>
      <button id="account-open" class="nav-btn primary">Login Google</button>
    </div>
  </header>
  <div id="online-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <section class="modal-card">
      <button id="modal-close" class="close-btn" aria-label="Tutup">×</button>
      <h2 id="modal-title">CYBER FLAPPY</h2>
      <div id="modal-content"></div>
    </section>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="./js/game.js" defer></script>
  <script type="module" src="./js/online.js"></script>
</body>
</html>

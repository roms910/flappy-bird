<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER FLAPPY // NEON OVERDRIVE</title>
    <style>
        /* Import font retro arcade & cyber UI */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent; /* hilangkan kilatan biru saat disentuh */
            touch-action: manipulation;
        }

        canvas, canvas:focus, canvas:active, #game-wrapper {
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #111633 0%, #04040a 100%);
        }

        canvas {
            display: block;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.25), 0 0 80px rgba(255, 0, 128, 0.15);
            background-color: #090b1a;
            cursor: pointer;
        }

        /* Subtle CRT Scanline overlay for authentic retro-cyber feel */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.18) 50%
            );
            background-size: 100% 4px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div class="crt-overlay"></div>
    </div>

<script>
/**
 * ============================================================================
 * CYBER FLAPPY // NEON OVERDRIVE
 * Single-File HTML5 Canvas Game Engine
 * Features:
 * - Authentic Flappy Bird Physics & Pixel-Art Vector Rendering
 * - 3 Selectable Cyber Bird Skins with 3-frame wing animation & neon trails
 * - Parallax Cyberpunk Skyline, Holograms, & Animated Circuit Floor
 * - 4 Hidden Buffs (Shield, Chrono Slow, Nano Shrink, 2x Data)
 * - 3 Hazards/Traps (EMP Laser Gate, Gravity Glitch Zone, Moving Cyber Pipes)
 * - Procedural MATH GATE system (+ - x / , missing-number & two-step problems) with 5 difficulty tiers,
 *   combo streak rewards, selectable operations and a "System Terminated" electrocution death + review
 * - Complete State Machine (Menu, Ready, Playing, Quiz Gate, Victory, Endless, GameOver)
 * - Procedural Retro-Cyber Web Audio API Synthesizer (SFX + Dynamic BGM)
 * ============================================================================
 */

(function() {
    'use strict';

    // =========================================================================
    // 1. CANVAS & RESPONSIVE SCALING SETUP
    // =========================================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Logical internal resolution (9:16 classic mobile/arcade aspect ratio, scales cleanly)
    // Tinggi logis tetap (800), lebar logis mengikuti rasio layar user.
    const LOGICAL_HEIGHT = 800;
    const MIN_LOGICAL_WIDTH = 340;
    const MAX_LOGICAL_WIDTH = 1600;
    let LOGICAL_WIDTH = 450;
    let UI_W = 450;        // lebar kolom UI (menu, HUD, modal) - maksimal 450
    let UI_OFFSET = 0;     // geser UI agar tetap di tengah pada layar lebar
    let BIRD_X = 115;
    let cityReady = false;
    let scaleRatio = 1;

    function resizeCanvas() {
        const windowW = window.innerWidth;
        const windowH = window.innerHeight;

        // Lebar logis = tinggi logis x rasio layar user
        const rawW = Math.round(LOGICAL_HEIGHT * windowW / windowH);
        const newW = Math.max(MIN_LOGICAL_WIDTH, Math.min(MAX_LOGICAL_WIDTH, rawW));
        const widthChanged = newW !== LOGICAL_WIDTH;
        LOGICAL_WIDTH = newW;

        const targetAspect = LOGICAL_WIDTH / LOGICAL_HEIGHT;
        const windowAspect = windowW / windowH;

        let finalW, finalH;
        if (windowAspect < targetAspect) {
            finalW = windowW;
            finalH = windowW / targetAspect;
        } else {
            finalH = windowH;
            finalW = windowH * targetAspect;
        }

        // Support high-DPI screens cleanly
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.style.width = `${finalW}px`;
        canvas.style.height = `${finalH}px`;
        canvas.width = Math.round(LOGICAL_WIDTH * dpr);
        canvas.height = Math.round(LOGICAL_HEIGHT * dpr);
        ctx.setTransform(canvas.width / LOGICAL_WIDTH, 0, 0, canvas.height / LOGICAL_HEIGHT, 0, 0);
        scaleRatio = finalW / LOGICAL_WIDTH;

        UI_W = Math.min(450, LOGICAL_WIDTH);
        UI_OFFSET = (LOGICAL_WIDTH - UI_W) / 2;
        BIRD_X = Math.max(100, Math.min(190, Math.round(LOGICAL_WIDTH * 0.25)));
        if (cityReady) {
            bird.x = BIRD_X;
            if (widthChanged) initCityscape();
        }
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 120));
    // resizeCanvas() pertama dipanggil setelah semua state dideklarasikan (lihat initCityscape di bawah)

    // =========================================================================
    // 2. PROCEDURAL WEB AUDIO API SOUND & SYNTH BGM ENGINE
    // =========================================================================
    class CyberAudioEngine {
        constructor() {
            this.ctx = null;
            this.enabled = true;
            this.bgmInterval = null;
            this.bgmStep = 0;
            this.isPlayingBgm = false;
        }

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    this.ctx = new AudioCtx();
                }
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        toggle() {
            this.enabled = !this.enabled;
            if (!this.enabled) {
                this.stopBgm();
            } else if (gameState === 'PLAYING' || gameState === 'READY') {
                this.startBgm();
            }
            return this.enabled;
        }

        playTone(freq, type, duration, vol = 0.15, slideFreq = null, delay = 0) {
            if (!this.enabled) return;
            this.init();
            if (!this.ctx) return;

            const now = this.ctx.currentTime + delay;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            if (slideFreq) {
                osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideFreq), now + duration);
            }

            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + duration);
        }

        playNoise(duration, vol = 0.2, filterFreq = 1000) {
            if (!this.enabled) return;
            this.init();
            if (!this.ctx) return;

            const bufferSize = this.ctx.sampleRate * duration;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = filterFreq;

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);

            noise.start();
        }

        // Authentic retro-cyber SFX
        sfxFlap() {
            this.playTone(260, 'square', 0.09, 0.12, 540);
            this.playTone(390, 'triangle', 0.08, 0.08, 680);
        }

        sfxScore() {
            this.playTone(987.77, 'square', 0.08, 0.12, null, 0);     // B5
            this.playTone(1318.51, 'square', 0.18, 0.12, null, 0.07); // E6
        }

        sfxBuff() {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((n, i) => {
                this.playTone(n, 'sine', 0.12, 0.15, n * 1.1, i * 0.05);
            });
        }

        sfxShieldBreak() {
            this.playNoise(0.25, 0.25, 800);
            this.playTone(600, 'sawtooth', 0.25, 0.18, 120);
        }

        sfxTrap() {
            this.playTone(180, 'sawtooth', 0.2, 0.16, 90);
            this.playTone(140, 'square', 0.2, 0.14, 70, 0.05);
        }

        sfxQuizWarning() {
            this.playTone(440, 'sawtooth', 0.12, 0.14, 880, 0);
            this.playTone(440, 'sawtooth', 0.12, 0.14, 880, 0.18);
        }

        sfxQuizCorrect() {
            const notes = [587.33, 739.99, 880, 1174.66];
            notes.forEach((n, i) => {
                this.playTone(n, 'triangle', 0.18, 0.18, null, i * 0.07);
            });
        }

        sfxQuizWrongElectrocute() {
            // Dramatic electric shock & system shutdown sound
            this.playNoise(0.65, 0.35, 1800);
            this.playTone(150, 'sawtooth', 0.6, 0.25, 45);
            this.playTone(920, 'square', 0.12, 0.15, 120, 0.05);
            this.playTone(760, 'square', 0.12, 0.15, 95, 0.18);
            this.playTone(540, 'sawtooth', 0.35, 0.2, 40, 0.32);
        }

        sfxGateTick() {
            this.playTone(1200, 'square', 0.04, 0.07);
        }

        sfxDecrypt() {
            this.playNoise(0.18, 0.12, 3200);
            for (let i = 0; i < 5; i++) {
                this.playTone(700 + Math.random() * 900, 'square', 0.03, 0.05, null, i * 0.035);
            }
        }

        sfxStreak(n) {
            const base = 523.25 * Math.pow(1.0595, Math.min(n, 10));
            [1, 1.25, 1.5, 2].forEach((m, i) => {
                this.playTone(base * m, 'triangle', 0.14, 0.14, null, i * 0.06);
            });
        }

        sfxWrongBuzz() {
            this.playTone(120, 'sawtooth', 0.22, 0.2, 80);
            this.playTone(95, 'square', 0.22, 0.14, 60, 0.12);
        }

        sfxCrash() {
            this.playNoise(0.3, 0.3, 400);
            this.playTone(160, 'sawtooth', 0.28, 0.22, 42);
        }

        sfxVictory() {
            const fanfare = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
            const times = [0, 0.12, 0.24, 0.36, 0.52, 0.66];
            fanfare.forEach((n, i) => {
                this.playTone(n, 'square', 0.22, 0.15, null, times[i]);
            });
        }

        sfxClick() {
            this.playTone(800, 'sine', 0.06, 0.12, 1200);
        }

        startBgm() {
            if (!this.enabled || this.isPlayingBgm) return;
            this.init();
            this.isPlayingBgm = true;
            this.bgmStep = 0;

            // Synthwave bassline loop
            const bassNotes = [110, 110, 130.81, 146.83, 110, 110, 164.81, 146.83];
            this.bgmInterval = setInterval(() => {
                if (!this.enabled || (gameState !== 'PLAYING' && gameState !== 'READY')) return;
                const freq = bassNotes[this.bgmStep % bassNotes.length];
                // Subtle low synth pulse
                this.playTone(freq, 'triangle', 0.18, 0.045, freq * 0.98);
                if (this.bgmStep % 4 === 0) {
                    this.playTone(freq * 2, 'sine', 0.08, 0.025);
                }
                this.bgmStep++;
            }, 240);
        }

        stopBgm() {
            this.isPlayingBgm = false;
            if (this.bgmInterval) {
                clearInterval(this.bgmInterval);
                this.bgmInterval = null;
            }
        }
    }

    const audio = new CyberAudioEngine();

    // =========================================================================
    // 3. GAME CONSTANTS, STAGE THEMES & SKINS
    // =========================================================================
    const GRAVITY = 0.44;
    const FLAP_STRENGTH = -7.6;
    const BASE_SCROLL_SPEED = 3.1;
    const FLOOR_HEIGHT = 110;
    const PLAYABLE_HEIGHT = LOGICAL_HEIGHT - FLOOR_HEIGHT;
    const PIPE_WIDTH = 72;
    const PIPE_GAP_DEFAULT = 152;
    const WIN_STAGE_TARGET = 5; // Complete Stage 5 (Score >= 50) to trigger Victory!

    // ---- PROGRESSIVE DIFFICULTY ----
    // Awal: lambat, celah lebar, jarak antar pipa jauh.
    // Makin jauh: makin cepat, celah makin sempit, jarak makin dekat (dibatasi agar tetap bisa dimainkan).
    const DIFFICULTY_FULL_SCORE = 70;          // skor di mana kesulitan mencapai maksimum
    const SPEED_START = 2.0,  SPEED_END = 4.3;
    const GAP_START = 215,    GAP_END = 132;
    const SPACING_START = 360, SPACING_END = 222;

    function lerp(a, b, t) { return a + (b - a) * t; }
    function getDifficulty() { return Math.min(1, score / DIFFICULTY_FULL_SCORE); }
    function getBaseScrollSpeed(d) { return lerp(SPEED_START, SPEED_END, d); }
    function getPipeGap(d) { return lerp(GAP_START, GAP_END, d); }
    function getPipeSpacing(d) { return lerp(SPACING_START, SPACING_END, d); }

    // Bird Skin Configurations
    const BIRD_SKINS = [
        {
            id: 'classic',
            name: 'CYBER YELLOW',
            bodyMain: '#FFD60A',
            bodyShade: '#E09F00',
            bodyHighlight: '#FFF3B0',
            wingColor: '#FFF8D6',
            beakTop: '#FF7B00',
            beakBottom: '#D00000',
            visorColor: '#00F5D4',
            trailColor: 'rgba(255, 214, 10, 0.65)'
        },
        {
            id: 'cyan',
            name: 'NEON CYAN',
            bodyMain: '#00F5D4',
            bodyShade: '#0096C7',
            bodyHighlight: '#CAF0F8',
            wingColor: '#E0FBFC',
            beakTop: '#FF007F',
            beakBottom: '#9D0208',
            visorColor: '#FFEE32',
            trailColor: 'rgba(0, 245, 212, 0.65)'
        },
        {
            id: 'crimson',
            name: 'CRIMSON GLITCH',
            bodyMain: '#FF2A6D',
            bodyShade: '#9B0036',
            bodyHighlight: '#FF8FA3',
            wingColor: '#FFD6E0',
            beakTop: '#05D9E8',
            beakBottom: '#005F73',
            visorColor: '#39FF14',
            trailColor: 'rgba(255, 42, 109, 0.65)'
        }
    ];

    // Stage Palettes (Changes dynamically as player advances stages)
    const STAGE_THEMES = [
        {
            stage: 1,
            name: 'SECTOR 01 // NEON DUSK',
            skyTop: '#090A1F',
            skyBottom: '#1B1448',
            cityFar: '#14193B',
            cityNear: '#1E2554',
            accentNeon: '#00F5D4',
            pipeBody: '#1B263B',
            pipeLight: '#415A77',
            pipeDark: '#0D1B2A',
            pipeNeon: '#00F5D4'
        },
        {
            stage: 2,
            name: 'SECTOR 02 // SYNTHWAVE',
            skyTop: '#1A0626',
            skyBottom: '#4A0E4E',
            cityFar: '#2A0B3B',
            cityNear: '#3D1254',
            accentNeon: '#FF2A6D',
            pipeBody: '#2D142C',
            pipeLight: '#510A32',
            pipeDark: '#190919',
            pipeNeon: '#FF2A6D'
        },
        {
            stage: 3,
            name: 'SECTOR 03 // MATRIX CORE',
            skyTop: '#03170E',
            skyBottom: '#0B3B24',
            cityFar: '#072617',
            cityNear: '#0E4229',
            accentNeon: '#39FF14',
            pipeBody: '#132A13',
            pipeLight: '#31572C',
            pipeDark: '#081C08',
            pipeNeon: '#39FF14'
        },
        {
            stage: 4,
            name: 'SECTOR 04 // SOLAR OVERLOAD',
            skyTop: '#1F0C04',
            skyBottom: '#592209',
            cityFar: '#331407',
            cityNear: '#4D1E0B',
            accentNeon: '#FF9E00',
            pipeBody: '#2B1B17',
            pipeLight: '#5C3A21',
            pipeDark: '#170D0A',
            pipeNeon: '#FF9E00'
        },
        {
            stage: 5,
            name: 'SECTOR 05 // OMEGA MAINFRAME',
            skyTop: '#0B0424',
            skyBottom: '#2B0959',
            cityFar: '#16093D',
            cityNear: '#240E5E',
            accentNeon: '#FFE600',
            pipeBody: '#1F1A38',
            pipeLight: '#463B7A',
            pipeDark: '#100D21',
            pipeNeon: '#FFE600'
        }
    ];

    // =========================================================================
    // 3b. MATH ENGINE - soal hitungan dasar (+ - x /) dibuat otomatis & bertingkat
    // =========================================================================
    // Soal tidak lagi dari daftar tetap: setiap gerbang membuat soal baru yang
    // selalu punya jawaban bilangan bulat >= 0. Tingkat kesulitan naik mengikuti
    // jumlah gerbang yang berhasil dijawab pada permainan itu.
    const MATH_OPS = {
        add: { id: 'add', sym: '+', name: 'TAMBAH', color: '#39FF14' },
        sub: { id: 'sub', sym: '-', name: 'KURANG', color: '#FF2A6D' },
        mul: { id: 'mul', sym: '×', name: 'KALI', color: '#FFE600' },
        div: { id: 'div', sym: '÷', name: 'BAGI', color: '#00F5D4' }
    };
    const MATH_OP_ORDER = ['add', 'sub', 'mul', 'div'];

    // Tier berganti berdasarkan jumlah gerbang yang sudah dijawab benar
    const MATH_TIERS = [
        { name: 'WARM-UP',   color: '#39FF14', at: 0 },
        { name: 'BASIC',     color: '#00F5D4', at: 1 },
        { name: 'SKILL',     color: '#38B6FF', at: 2 },
        { name: 'PRO',       color: '#FFE600', at: 4 },
        { name: 'OVERCLOCK', color: '#FF2A6D', at: 6 }
    ];
    const MATH_FIRST_GATE_SCORE = 6;   // gerbang pertama muncul di skor ini
    const MATH_GATE_INTERVAL = 8;      // gerbang berikutnya setiap +8 skor
    const SLOT_COLORS = ['#00F5D4', '#FF2A6D', '#FFE600', '#B388FF'];
    const SLOT_LABELS = ['A', 'B', 'C', 'D'];

    // Rentang angka per operasi & per tier (indeks = tier)
    const MATH_RANGES = {
        add: [
            { a: [1, 9],     b: [1, 9] },
            { a: [10, 49],   b: [3, 39] },
            { a: [25, 99],   b: [12, 75] },
            { a: [100, 450], b: [25, 299] },
            { a: [200, 700], b: [75, 499] }
        ],
        sub: [
            { a: [5, 18] },
            { a: [20, 70] },
            { a: [50, 150] },
            { a: [150, 650] },
            { a: [300, 999] }
        ],
        mul: [
            { a: [2, 5],   b: [2, 5] },
            { a: [2, 9],   b: [2, 9] },
            { a: [3, 12],  b: [3, 12] },
            { a: [11, 25], b: [3, 9] },
            { a: [12, 35], b: [4, 12] }
        ],
        div: [
            { d: [2, 5],  q: [2, 5] },
            { d: [2, 9],  q: [2, 9] },
            { d: [3, 12], q: [3, 12] },
            { d: [2, 12], q: [10, 30] },
            { d: [3, 15], q: [11, 40] }
        ]
    };

    // ---- Pengaturan operasi yang aktif (disimpan di browser) ----
    const mathSettings = { add: true, sub: true, mul: true, div: true };
    try {
        const savedOps = JSON.parse(localStorage.getItem('cyberFlappyMathOps') || 'null');
        if (savedOps) {
            MATH_OP_ORDER.forEach(id => {
                if (typeof savedOps[id] === 'boolean') mathSettings[id] = savedOps[id];
            });
        }
        if (!MATH_OP_ORDER.some(id => mathSettings[id])) mathSettings.add = true;
    } catch (e) { /* localStorage tidak tersedia: pakai default */ }

    let bestComboAll = 0;
    try { bestComboAll = parseInt(localStorage.getItem('cyberFlappyBestCombo') || '0', 10) || 0; } catch (e) {}

    // ---- Statistik matematika untuk satu permainan ----
    const mathStats = {
        solved: 0,
        wrong: 0,
        streak: 0,
        bestStreak: 0,
        perOp: { add: 0, sub: 0, mul: 0, div: 0 }
    };
    let mathHistory = [];      // soal terakhir, supaya tidak berulang
    let lastMathResult = null; // hasil gerbang terakhir (untuk review saat kalah)

    function resetMathStats() {
        mathStats.solved = 0;
        mathStats.wrong = 0;
        mathStats.streak = 0;
        mathStats.bestStreak = 0;
        MATH_OP_ORDER.forEach(id => { mathStats.perOp[id] = 0; });
        mathHistory = [];
        lastMathResult = null;
    }

    function enabledMathOps() {
        const list = MATH_OP_ORDER.filter(id => mathSettings[id]);
        return list.length ? list : ['add'];
    }

    // Mengembalikan false jika toggle ditolak (minimal 1 operasi harus aktif)
    function toggleMathOp(id) {
        if (mathSettings[id] && enabledMathOps().length <= 1) return false;
        mathSettings[id] = !mathSettings[id];
        try { localStorage.setItem('cyberFlappyMathOps', JSON.stringify(mathSettings)); } catch (e) {}
        return true;
    }

    function getMathTier() {
        let tier = 0;
        for (let i = 0; i < MATH_TIERS.length; i++) {
            if (mathStats.solved >= MATH_TIERS[i].at) tier = i;
        }
        return tier;
    }

    // ---- Helper acak ----
    function ri(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function shuffleArr(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
    }

    // ---- Token soal (dipakai untuk menggambar persamaan berwarna) ----
    const TOK = {
        num: v => ({ t: String(v), k: 'num' }),
        op: id => ({ t: MATH_OPS[id].sym, k: 'op', c: MATH_OPS[id].color, id: id }),
        paren: s => ({ t: s, k: 'paren' }),
        eq: () => ({ t: '=', k: 'eq' }),
        q: () => ({ t: '?', k: 'q' })
    };

    function applyOp(id, x, y) {
        switch (id) {
            case 'add': return x + y;
            case 'sub': return x - y;
            case 'mul': return x * y;
            case 'div': return y !== 0 ? x / y : NaN;
        }
        return NaN;
    }

    function isLowOp(id) { return id === 'add' || id === 'sub'; }

    // Satu operasi dasar {a, b, r} - hasil selalu bulat & tidak negatif
    function genBinary(opId, tier) {
        const R = MATH_RANGES[opId][tier];
        let a, b, r;
        if (opId === 'add') {
            a = ri(R.a[0], R.a[1]);
            b = ri(R.b[0], R.b[1]);
            r = a + b;
        } else if (opId === 'sub') {
            a = ri(R.a[0], R.a[1]);
            b = ri(Math.max(2, Math.floor(a * 0.12)), Math.floor(a * 0.88));
            r = a - b;
        } else if (opId === 'mul') {
            a = ri(R.a[0], R.a[1]);
            b = ri(R.b[0], R.b[1]);
            r = a * b;
        } else {
            b = ri(R.d[0], R.d[1]);
            r = ri(R.q[0], R.q[1]);
            a = b * r;
        }
        return { opId, a, b, r };
    }

    // Tipe 1: "a + b = ?"
    function genStandard(opId, tier) {
        const f = genBinary(opId, tier);
        const traps = [];
        if (opId !== 'add') traps.push(f.a + f.b);
        if (opId !== 'sub') traps.push(Math.abs(f.a - f.b));
        if (opId !== 'mul') traps.push(f.a * f.b);
        if (opId !== 'div' && f.b !== 0 && f.a % f.b === 0) traps.push(f.a / f.b);
        if (opId === 'add' || opId === 'sub') traps.push(f.r + 10, f.r - 10); // salah simpan/pinjam
        return {
            kind: 'STANDARD',
            kindLabel: 'HITUNG',
            tokens: [TOK.num(f.a), TOK.op(opId), TOK.num(f.b), TOK.eq(), TOK.q()],
            value: f.r,
            ops: [opId],
            traps: traps
        };
    }

    // Tipe 2: "? + 7 = 15" atau "20 - ? = 8"
    function genMissing(opId, tier) {
        const f = genBinary(opId, tier);
        const hideFirst = Math.random() < 0.5;
        let tokens, value, known;
        if (hideFirst) {
            tokens = [TOK.q(), TOK.op(opId), TOK.num(f.b), TOK.eq(), TOK.num(f.r)];
            value = f.a; known = f.b;
        } else {
            tokens = [TOK.num(f.a), TOK.op(opId), TOK.q(), TOK.eq(), TOK.num(f.r)];
            value = f.b; known = f.a;
        }
        const traps = [known + f.r, Math.abs(known - f.r), known * f.r];
        if (known !== 0 && f.r % known === 0) traps.push(f.r / known);
        return {
            kind: 'MISSING',
            kindLabel: 'ANGKA HILANG',
            tokens: tokens,
            value: value,
            ops: [opId],
            traps: traps
        };
    }

    // Tipe 3: dua langkah, mis. "6 x 4 + 5 = ?" atau "(8 + 4) x 3 = ?"
    // Aturan urutan operasi dihormati: kurung hanya dipakai bila perlu.
    function genChain(tier, ops) {
        const sub = Math.max(0, tier - 1);
        const smallMax = tier >= 3 ? 60 : 25;
        const mulMax = tier >= 3 ? 9 : 5;

        for (let tries = 0; tries < 50; tries++) {
            const op1 = pick(ops);
            const op2 = pick(ops);
            const f = genBinary(op1, sub);
            const v1 = f.r;
            let c, v2;

            if (op2 === 'add') {
                c = ri(2, smallMax);
                v2 = v1 + c;
            } else if (op2 === 'sub') {
                if (v1 < 4) continue;
                c = ri(2, Math.min(v1 - 1, smallMax));
                v2 = v1 - c;
            } else if (op2 === 'mul') {
                c = ri(2, mulMax);
                v2 = v1 * c;
            } else {
                const divisors = [];
                for (let d = 2; d <= 12; d++) if (v1 % d === 0) divisors.push(d);
                if (!divisors.length) continue;
                c = pick(divisors);
                v2 = v1 / c;
            }
            if (!Number.isInteger(v2) || v2 < 0 || v2 > 999) continue;

            const needParens = isLowOp(op1) && !isLowOp(op2);
            let tokens;
            if (needParens) {
                tokens = [TOK.paren('('), TOK.num(f.a), TOK.op(op1), TOK.num(f.b), TOK.paren(')'),
                          TOK.op(op2), TOK.num(c)];
            } else if (op2 === 'add' && !isLowOp(op1) && Math.random() < 0.5) {
                // c + a x b  (perkalian/pembagian tetap dihitung duluan)
                tokens = [TOK.num(c), TOK.op('add'), TOK.num(f.a), TOK.op(op1), TOK.num(f.b)];
            } else {
                tokens = [TOK.num(f.a), TOK.op(op1), TOK.num(f.b), TOK.op(op2), TOK.num(c)];
            }
            tokens.push(TOK.eq(), TOK.q());

            // Jebakan: kesalahan urutan operasi & lupa langkah terakhir
            const traps = [v1, c];
            const wrongOrder = applyOp(op1, f.a, applyOp(op2, f.b, c));
            if (Number.isInteger(wrongOrder)) traps.push(wrongOrder);
            traps.push(v2 + 10, v2 - 10);

            return {
                kind: 'CHAIN',
                kindLabel: 'DUA LANGKAH',
                tokens: tokens,
                value: v2,
                ops: op1 === op2 ? [op1] : [op1, op2],
                traps: traps
            };
        }
        return null;
    }

    // Membuat pilihan jawaban: 1 benar + pengecoh yang masuk akal
    function buildMathOptions(p, slotCount) {
        const ans = p.value;
        const pool = new Map();
        const maxPlausible = Math.max(ans * 4, ans + 40);
        const addCand = (v, w) => {
            if (!Number.isFinite(v)) return;
            v = Math.round(v);
            if (v < 0 || v === ans || v > maxPlausible) return;
            pool.set(v, Math.max(pool.get(v) || 0, w + Math.random()));
        };

        (p.traps || []).forEach(v => addCand(v, 6));
        [1, 2, 3, 10].forEach(d => { addCand(ans + d, 3); addCand(ans - d, 3); });
        if (ans >= 20) { addCand(ans + 20, 2); addCand(ans - 20, 2); }
        const digits = String(ans);
        if (digits.length >= 2) addCand(parseInt(digits[1] + digits[0] + digits.slice(2), 10), 4.5);

        const ranked = Array.from(pool.entries()).sort((x, y) => y[1] - x[1]).map(e => e[0]);
        const wrong = ranked.slice(0, slotCount - 1);
        let k = 4;
        while (wrong.length < slotCount - 1) {
            const v = ans + (Math.random() < 0.5 ? -k : k);
            if (v >= 0 && v !== ans && wrong.indexOf(v) === -1) wrong.push(v);
            k++;
        }
        const options = shuffleArr([ans].concat(wrong));
        return { options: options.map(String), correctIndex: options.indexOf(ans) };
    }

    function tokensToText(tokens, solvedValue) {
        return tokens.map(t => (t.k === 'q' && solvedValue !== undefined) ? String(solvedValue) : t.t).join(' ');
    }

    // Titik masuk: membuat satu soal lengkap sesuai tier & operasi yang dipilih
    function generateMathProblem() {
        const tier = getMathTier();
        const ops = enabledMathOps();
        const pChain = [0, 0, 0.30, 0.40, 0.50][tier];
        const pMissing = [0, 0.25, 0.25, 0.25, 0.25][tier];

        let p = null;
        for (let attempt = 0; attempt < 14; attempt++) {
            const roll = Math.random();
            let cand = null;
            if (roll < pChain) cand = genChain(tier, ops);
            else if (roll < pChain + pMissing) cand = genMissing(pick(ops), tier);
            else cand = genStandard(pick(ops), tier);
            if (!cand) continue;
            cand.text = tokensToText(cand.tokens);
            p = cand;
            if (mathHistory.indexOf(cand.text) === -1) break;
        }
        if (!p) {
            p = genStandard(pick(ops), tier);
            p.text = tokensToText(p.tokens);
        }

        const slotCount = tier >= 3 ? 4 : 3;
        const built = buildMathOptions(p, slotCount);
        p.options = built.options;
        p.correctIndex = built.correctIndex;
        p.tier = tier;
        p.tierInfo = MATH_TIERS[tier];
        p.solvedText = tokensToText(p.tokens, p.value);

        mathHistory.push(p.text);
        if (mathHistory.length > 8) mathHistory.shift();
        return p;
    }

    function flapBird() {
        if (gameState === 'READY') {
            startActualPlay();
            return;
        }
        if (gameState !== 'PLAYING') return;

        // If gravity is inverted by anomaly trap, flap pushes downwards!
        const dir = activeEffects.gravityInvert > 0 ? -1 : 1;
        bird.vy = FLAP_STRENGTH * dir;
        bird.wingFrame = 1;
        bird.wingTimer = 0;
        audio.sfxFlap();

        // Spawn wing thrust particles
        const skin = BIRD_SKINS[selectedSkinIndex];
        for (let i = 0; i < 6; i++) {
            particles.push({
                x: bird.x - 12,
                y: bird.y + 4,
                vx: -2 - Math.random() * 2.5,
                vy: (Math.random() - 0.5) * 3,
                size: 3 + Math.random() * 3,
                color: skin.visorColor,
                alpha: 1,
                decay: 0.045
            });
        }
    }

    function addScore(points, popupX = bird.x, popupY = bird.y - 25) {
        const multiplier = activeEffects.doubleScore > 0 ? 2 : 1;
        const totalAdded = points * multiplier;
        score += totalAdded;
        scorePopScale = 1.45;
        audio.sfxScore();

        floatingTexts.push({
            x: popupX,
            y: popupY,
            text: multiplier > 1 ? `+${totalAdded} (2X!)` : `+${totalAdded}`,
            color: multiplier > 1 ? '#FFE600' : '#00F5D4',
            alpha: 1,
            vy: -1.6
        });

        if (score > highScore) {
            highScore = score;
            isNewHighScore = true;
            localStorage.setItem('cyberFlappyHighScore', highScore.toString());
        }

        // Check Stage Progression (Every 10 points = new stage)
        const calculatedStage = Math.floor(score / 10) + 1;
        if (calculatedStage > currentStage) {
            currentStage = calculatedStage;
            if (!endlessMode && currentStage > WIN_STAGE_TARGET) {
                triggerVictory();
                return;
            }
            const theme = getTheme();
            stageBannerText = endlessMode
                ? `ENDLESS OVERDRIVE // LVL ${currentStage}`
                : theme.name;
            stageBannerTimer = 150;
            screenFlashColor = theme.accentNeon;
            screenFlashAlpha = 0.25;
        }
    }

        const idx = (currentStage - 1) % STAGE_THEMES.length;

    // =========================================================================
    // 6. SPAWNING PIPES, BUFFS, TRAPS & MATH GATES
    // =========================================================================
    function spawnObstacleWave(spawnX) {
        // Check if it's time to spawn an Interactive Quiz Gate!
        if (score >= nextQuizScoreThreshold && quizGates.length === 0 && quizWarningTimer === 0) {
            beginMathWarning();
            return false;
        }

        // Pipa biasa berhenti selama soal sedang didekripsi / gerbang belum dijawab
        if (quizWarningTimer > 0 || quizGates.some(g => !g.resolved)) return false;

        // Progressive difficulty (0..1) berdasarkan skor
        const d = getDifficulty();
        const gapSize = getPipeGap(d);
        const spacing = getPipeSpacing(d);
        const speedNow = getBaseScrollSpeed(d);
        const minTop = 75;
        const maxTop = PLAYABLE_HEIGHT - gapSize - 75;
        let gapTop = minTop + Math.random() * (maxTop - minTop);

        // Batasi perbedaan tinggi celah antar pipa agar selalu bisa dijangkau
        const prevPipe = pipes[pipes.length - 1];
        if (prevPipe) {
            const maxShift = Math.max(120, 3.2 * (spacing / speedNow));
            gapTop = Math.max(prevPipe.gapTop - maxShift, Math.min(prevPipe.gapTop + maxShift, gapTop));
            gapTop = Math.max(minTop, Math.min(maxTop, gapTop));
        }

        // Pipa bergerak & laser muncul bertahap, bukan langsung
        const isMoving = d >= 0.17 && Math.random() < 0.10 + 0.30 * d;
        const hasLaserTrap = d >= 0.25 && !isMoving && Math.random() < 0.08 + 0.14 * d;

        const newPipe = {
            x: spawnX,
            gapTop: gapTop,
            gapHeight: gapSize,
            passed: false,
            isMoving: isMoving,
            moveDir: Math.random() > 0.5 ? 1 : -1,
            moveSpeed: 0.55 + 0.75 * d,
            hasLaserTrap: hasLaserTrap,
            laserSide: Math.random() > 0.5 ? 0 : 1, // 0 = laser dari atas, 1 = dari bawah (selalu ada sisi aman)
            laserTimer: Math.floor(Math.random() * 120) // Cycles on/off
        };
        nextPipeX = spawnX + spacing;
        pipes.push(newPipe);

        // Chance to spawn a Hidden Buff inside the pipe gap or slightly past it
        if (Math.random() < 0.32) {
            const buffTypes = ['SHIELD', 'SLOWMO', 'SHRINK', 'DOUBLE'];
            const type = buffTypes[Math.floor(Math.random() * buffTypes.length)];
            collectibles.push({
                kind: 'BUFF',
                type: type,
                x: newPipe.x + PIPE_WIDTH / 2,
                y: gapTop + gapSize / 2 + (Math.random() - 0.5) * 35,
                radius: 15,
                collected: false,
                bobOffset: Math.random() * Math.PI * 2
            });
        }
        // Or spawn a Gravity Glitch Anomaly Zone between pipes
        else if (d >= 0.17 && Math.random() < 0.22) {
            collectibles.push({
                kind: 'TRAP_GRAVITY',
                type: 'GRAVITY_INVERT',
                x: newPipe.x + PIPE_WIDTH + 95,
                y: 140 + Math.random() * (PLAYABLE_HEIGHT - 280),
                radius: 26,
                collected: false,
                bobOffset: 0
            });
        }
        return true;
    }
